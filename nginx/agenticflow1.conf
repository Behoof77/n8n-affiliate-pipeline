server {
    listen 80;
    listen [::]:80;
    server_name agenticflow1.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agenticflow1.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/agenticflow1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenticflow1.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Public media previews + Instagram video_url (renderer service)
    location /media/ {
        proxy_pass http://127.0.0.1:8010/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # n8n editor + webhooks
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
